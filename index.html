<!doctype html>
<!--
  Page relais de la séance cinéma de SummerCamp.
  Le lecteur intégré de YouTube refuse de s'afficher sans page parente (erreur 153) : le jeu ouvre donc cette page,
  hébergée à une adresse https fixe (cinema.json, "relayUrl"), qui intègre le lecteur par l'API officielle.
  Paramètres : ?v=<identifiant de 11 caractères>&vol=<0 à 100>[&t=<départ en secondes>][&play=0 : prête, sans lancer].
  Le jeu clique sur le calque #gate dès que la page répond (geste exigé pour lire avec son), puis la pilote par
  window.scCinema (play, pause, seek, setVolume) et lit son état dans le titre :
  sc:loading, sc:ready, sc:playing, sc:paused, sc:buffering, sc:ended, sc:error:<code YouTube>,
  suivi, une fois le lecteur prêt, de la position et de la durée en secondes, puis du clic d'autorisation reçu (#a1) ou non (#a0) :
  sc:playing@125/3600#a1. Le jeu répète son clic tant que la page affiche #a0.
-->
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>sc:loading</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #player { position: fixed; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    #gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: transparent; }
  </style>
</head>
<body>
  <div id="player"></div>
  <!-- Calque au-dessus du lecteur : le jeu y clique une fois après le chargement. Ce geste autorise la lecture avec son
       (règle d'autoplay du navigateur) sans toucher aux boutons de YouTube ; ensuite, tout passe par window.scCinema. -->
  <div id="gate"></div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var videoId = params.get('v') || '';
      var volume = Math.max(0, Math.min(100, parseInt(params.get('vol') || '100', 10) || 0));
      var start = Math.max(0, parseInt(params.get('t') || '0', 10) || 0);
      var autoplay = params.get('play') !== '0';
      var player = null;
      var ready = false;
      var pending = [];
      var state = 'loading';
      var activated = false;
      var wantPlay = autoplay;

      // Le titre porte l'état, puis, une fois le lecteur prêt, la position et la durée en secondes, puis si la page a reçu le
      // clic d'autorisation : « sc:playing@125/3600#a1 ».
      function publish() {
        var text = 'sc:' + state;
        if (ready && state.indexOf('error') !== 0) {
          text += '@' + Math.floor(player.getCurrentTime() || 0) + '/' + Math.floor(player.getDuration() || 0);
        }
        text += activated ? '#a1' : '#a0';
        if (document.title !== text) { document.title = text; }
      }

      function status(text) { state = text; publish(); }

      function call(action) {
        if (ready) { action(player); } else { pending.push(action); }
      }

      // Sans geste de l'utilisateur, le navigateur refuse de lancer une vidéo avec son : la lecture attend le clic sur le calque.
      function playIfAllowed(p) {
        if (activated && wantPlay) { p.playVideo(); }
      }

      document.getElementById('gate').addEventListener('pointerdown', function () {
        activated = true;
        publish();
        call(playIfAllowed);
      });

      window.scCinema = {
        play: function () { wantPlay = true; call(playIfAllowed); },
        pause: function () { wantPlay = false; call(function (p) { p.pauseVideo(); }); },
        seek: function (seconds) {
          call(function (p) { p.seekTo(Math.max(0, Math.round(seconds)), true); publish(); });
        },
        setVolume: function (value) {
          volume = Math.max(0, Math.min(100, Math.round(value)));
          call(function (p) {
            p.setVolume(volume);
            if (volume > 0 && p.isMuted()) { p.unMute(); }
          });
        }
      };

      if (!/^[A-Za-z0-9_-]{11}$/.test(videoId)) {
        status('error:2');
        return;
      }

      var stateNames = { '-1': 'ready', '0': 'ended', '1': 'playing', '2': 'paused', '3': 'buffering', '5': 'ready' };

      window.onYouTubeIframeAPIReady = function () {
        player = new YT.Player('player', {
          width: '100%',
          height: '100%',
          videoId: videoId,
          playerVars: { autoplay: 0, start: start, playsinline: 1, rel: 0, controls: 0 },
          events: {
            onReady: function (event) {
              ready = true;
              event.target.setVolume(volume);
              playIfAllowed(event.target);
              status('ready');
              var queued = pending;
              pending = [];
              for (var i = 0; i < queued.length; i++) { queued[i](player); }
              setInterval(publish, 500);
            },
            onStateChange: function (event) {
              var name = stateNames[String(event.data)];
              if (name) { status(name); }
            },
            onError: function (event) { status('error:' + event.data); }
          }
        });
      };

      var script = document.createElement('script');
      script.src = 'https://www.youtube.com/iframe_api';
      script.onerror = function () { status('error:api'); };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
